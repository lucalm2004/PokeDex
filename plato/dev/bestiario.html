<!doctype html><html><head><meta charset="utf-8"><title>Bestiario</title>
<style>
body{margin:0;background:#2b2018;color:#f2e5d1;font:12px monospace}
canvas{image-rendering:pixelated;display:block}
h2{font-size:13px;font-weight:normal;color:#e0b04a;margin:12px 8px 6px}
.grupo{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px}
.ficha{background:#120c08;padding:5px;display:flex;flex-direction:column;gap:4px}
.par{display:flex;gap:4px}
.mini{padding:6px}
.oscuro{background:#1a120c}.medio{background:#6e5a48}
.escena{display:flex;align-items:flex-end;padding:6px 12px 0;background:#6e5a48;border-bottom:6px solid #4a3a2e}
.hueco{width:18px}
</style></head><body>
<script src="../src/pixel.js"></script><script src="../src/heroes.js"></script><script src="../src/monstruos.js"></script>
<script>
/* ?k=clave1,clave2 muestra solo esas; ?e=10 cambia el aumento grande; ?escena=0 oculta las escenas. */
const q = new URLSearchParams(location.search);
const esc = +(q.get("e") || 4);
const solo = q.get("k") ? q.get("k").split(",") : null;
const el = (tag, clase, txt) => { const e = document.createElement(tag); if (clase) e.className = clase; if (txt) e.textContent = txt; return e; };
const lienzo = (g, e, clase) => { const cv = g.aCanvas(e); if (clase) cv.className = clase; return cv; };

function grupo(titulo, tabla) {
  const claves = Object.keys(tabla).filter(k => !solo || solo.includes(k));
  if (!claves.length) return;
  document.body.appendChild(el("h2", null, `${titulo} (${claves.length})`));
  const caja = document.body.appendChild(el("div", "grupo"));
  for (const k of claves) {
    const g = tabla[k]();
    const f = caja.appendChild(el("div", "ficha"));
    f.appendChild(el("span", null, k));
    const grande = f.appendChild(el("div", "par"));
    grande.append(lienzo(g, esc, "oscuro"), lienzo(g, esc, "medio"));
    const peque = f.appendChild(el("div", "par"));
    for (const fondo of ["oscuro", "medio"]) peque.appendChild(el("div", "mini " + fondo)).appendChild(lienzo(g, 1));
  }
}
grupo("MONSTRUOS", MONSTRUOS);
grupo("PNJ", PNJ);

/* En escena a 3×: dos héroes a la izquierda frente a cada monstruo, y los PNJ en fila junto a un héroe. */
if (q.get("escena") !== "0") {
  const heroes = [
    HEROES.componer({ raza: "humano", clase: "guerrero", pelo: "castano" }),
    HEROES.componer({ raza: "elfo", clase: "mago", pelo: "rubio", peinado: "largo" })
  ];
  const claves = Object.keys(MONSTRUOS).filter(k => !solo || solo.includes(k));
  if (claves.length) {
    document.body.appendChild(el("h2", null, "En escena (3×)"));
    const caja = document.body.appendChild(el("div", "grupo"));
    for (const k of claves) {
      const e = caja.appendChild(el("div", "escena"));
      heroes.forEach(h => e.appendChild(lienzo(h, 3)));
      e.appendChild(el("div", "hueco"));
      e.appendChild(lienzo(MONSTRUOS[k](), 3));
    }
  }
  const pnj = Object.keys(PNJ).filter(k => !solo || solo.includes(k));
  if (pnj.length) {
    document.body.appendChild(el("h2", null, "PNJ en fila (3×)"));
    const fila = document.body.appendChild(el("div", "grupo")).appendChild(el("div", "escena"));
    fila.appendChild(lienzo(heroes[1], 3));
    pnj.forEach(k => fila.appendChild(lienzo(PNJ[k](), 3)));
  }
}
</script></body></html>
