<title>Dados y Mazmorras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/*CSS*/
</style>
<!--CUERPO-->
<section id="taberna" class="taberna" hidden>
  <header class="portada">
    <h1 class="logo">Dados <span>y</span> Mazmorras</h1>
    <p class="lema">Rol de espada y brujería · de 1 a 6 jugadores</p>
  </header>
  <div class="escenario escenario-taberna" id="caja-taberna"><canvas id="lienzo-taberna" aria-label="La taberna del Grifo Tuerto con vuestro grupo"></canvas></div>
  <div class="modos" id="modos" role="tablist" aria-label="Cómo vais a jugar"></div>
  <div id="taberna-cuerpo"></div>
</section>

<section id="juego" class="juego" hidden>
  <header class="barra">
    <p class="logo-mini">Dados <span>y</span> Mazmorras</p>
    <ol class="capitulos" id="capitulos" aria-label="Capítulos"></ol>
    <div class="herramientas" id="herramientas"></div>
  </header>
  <div class="tablero">
    <div class="izquierda">
      <div class="escenario" id="caja-escenario"><canvas id="lienzo" aria-label="Escenario"></canvas></div>
      <div class="grupo" id="grupo" aria-label="El grupo"></div>
      <div class="pie-izq">
      <section class="mesa marco" aria-label="Mesa de dados">
        <canvas id="dado" class="dado" data-tam="64" aria-hidden="true"></canvas>
        <div class="mesa-info">
          <p id="dado-info">Cuando una acción lo pida, el d20 rodará aquí.</p>
          <div class="libres" aria-label="Tiradas libres">
            <span class="etiqueta">Tirada libre</span>
            <button type="button" data-libre="4">d4</button>
            <button type="button" data-libre="6">d6</button>
            <button type="button" data-libre="8">d8</button>
            <button type="button" data-libre="10">d10</button>
            <button type="button" data-libre="12">d12</button>
            <button type="button" data-libre="20">d20</button>
          </div>
        </div>
        <button type="button" class="boton sec mini solo-movil" data-acc="ver-cronica">Crónica</button>
      </section>
      <section class="cronica marco" aria-label="Crónica">
        <h3>Crónica de la partida</h3>
        <ol id="cronica"></ol>
      </section>
      </div>
    </div>
    <div class="derecha">
      <section class="escena marco" id="escena" aria-live="polite"></section>
    </div>
  </div>
</section>

<p id="aviso" class="aviso" role="status" hidden></p>
<div id="capa" class="capa" hidden><div class="modal marco" id="modal" role="dialog" aria-modal="true" aria-label="Detalle"></div></div>
