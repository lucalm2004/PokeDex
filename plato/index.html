<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diálogos y Dados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: en partida, una sola pantalla sin scroll: escenario pixelado y fichas del grupo a la izquierda;
   escena, dado y crónica a la derecha. En móvil todo se apila y solo la escena se desplaza por dentro.
   Estética de vasija de figuras rojas llevada al pixel art: barro sobre vidriado negro, marcos con esquinas recortadas. */
:root {
  --noche: #120b08;
  --panel: #22160f;
  --panel-2: #2e1e14;
  --hundido: #180f0a;
  --borde: #5c3a22;
  --borde-luz: #8f5a30;
  --barro: #d0743f;
  --barro-luz: #f0a868;
  --barro-sombra: #8f4122;
  --hueso: #f2e5d1;
  --ceniza: #b9a089;
  --tenue: #8a7262;
  --exito: #a8c860;
  --fallo: #ef6c52;
  --oro: #f0c050;
  --mar: #6aa8cc;
  --velo: rgba(8, 5, 3, 0.8);
  --f-titulo: "Silkscreen", "Courier New", monospace;
  --f-texto: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --px: 3px;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--noche); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--noche); color: var(--hueso); font-family: var(--f-texto); font-size: 16px; line-height: 1.45; }
body.jugando { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
h1, h2, h3, h4 { text-wrap: balance; }
.etiqueta { font-family: var(--f-titulo); font-size: 11px; letter-spacing: .04em; color: var(--ceniza); margin: 0; font-weight: 400; }
.espera { margin: 0; color: var(--ceniza); }

/* ---------- Marcos y botones pixelados ---------- */
.marco {
  background: var(--panel);
  margin: var(--px);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--borde), 0 var(--px) 0 0 var(--borde),
    calc(var(--px) * -1) 0 0 0 var(--borde), var(--px) 0 0 0 var(--borde),
    inset 0 var(--px) 0 0 var(--panel-2);
}
.boton {
  --b: var(--barro); --b-luz: var(--barro-luz); --b-sombra: var(--barro-sombra); --b-texto: var(--noche);
  font-family: var(--f-titulo); font-size: 13px; line-height: 1.1; letter-spacing: .02em; font-weight: 400;
  color: var(--b-texto); background: var(--b); border: 0; border-radius: 0;
  padding: 9px 14px 11px; margin: var(--px);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--noche), 0 var(--px) 0 0 var(--noche),
    calc(var(--px) * -1) 0 0 0 var(--noche), var(--px) 0 0 0 var(--noche),
    inset 0 calc(var(--px) * -1) 0 0 var(--b-sombra), inset 0 var(--px) 0 0 var(--b-luz);
}
.boton:hover:not(:disabled) { --b: var(--barro-luz); --b-luz: var(--hueso); }
.boton:active:not(:disabled) { transform: translateY(2px); }
.boton:disabled { opacity: .45; }
.boton.sec { --b: var(--panel-2); --b-luz: var(--borde-luz); --b-sombra: var(--hundido); --b-texto: var(--barro-luz); }
.boton.sec:hover:not(:disabled) { --b: var(--borde); --b-texto: var(--hueso); }
.boton.mini { font-size: 11px; padding: 6px 8px 8px; }
.boton.grande { font-size: 16px; padding: 13px 22px 15px; }
.boton[aria-pressed="true"].sec { --b: var(--barro-sombra); --b-texto: var(--hueso); }

/* ---------- Taberna: portada, creación de héroes y salas ---------- */
.taberna {
  max-width: 1180px; margin: 0 auto; display: grid; gap: 14px;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.portada { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 20px; }
.logo {
  font-family: var(--f-titulo); font-weight: 700; font-size: clamp(30px, 6.2vw, 58px); line-height: 1; margin: 0;
  color: var(--barro-luz); text-shadow: 3px 3px 0 var(--barro-sombra), 6px 6px 0 var(--noche); letter-spacing: .01em;
}
.logo span { color: var(--hueso); }
.lema { font-family: var(--f-titulo); font-size: 12px; color: var(--ceniza); margin: 0 0 6px; }
.escenario { min-height: 0; min-width: 0; display: grid; place-items: center; overflow: hidden; flex: none; }
.escenario canvas { box-shadow: 0 0 0 var(--px) var(--borde), 0 0 0 calc(var(--px) * 2) var(--noche); }
.escenario-taberna { min-height: 120px; }
.modos { display: flex; gap: 0; border-bottom: var(--px) solid var(--borde); }
.modos button {
  background: transparent; border: 0; padding: 9px 14px; margin-bottom: calc(var(--px) * -1);
  font-family: var(--f-titulo); font-size: 13px; color: var(--tenue); border-bottom: var(--px) solid transparent;
}
.modos button[aria-selected="true"] { color: var(--barro-luz); border-bottom-color: var(--barro); }
.creacion { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; align-items: start; }
.plantel { padding: 12px; display: grid; gap: 8px; }
.plantel h3, .editor h4, .bloque h3, .modal h3 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: 14px; color: var(--barro-luz); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.plantel-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.plantel-fila { display: flex; align-items: stretch; gap: 4px; }
.plantel-heroe {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; padding: 4px 8px 4px 4px;
  background: var(--hundido); border: 0; box-shadow: inset 0 0 0 2px var(--borde);
}
.plantel-heroe strong { display: block; font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.plantel-heroe span { min-width: 0; }
.plantel-fila.sel .plantel-heroe { box-shadow: inset 0 0 0 2px var(--oro); background: var(--panel-2); }
.quitar { border: 0; background: var(--hundido); color: var(--tenue); width: 30px; font-family: var(--f-titulo); font-size: 16px; box-shadow: inset 0 0 0 2px var(--borde); }
.quitar:hover { color: var(--fallo); }
.editor { padding: 14px 16px; display: grid; gap: 16px; min-width: 0; }
.ed-cabecera { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.retrato-grande { background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde); }
.ed-nombre { display: grid; gap: 6px; min-width: 0; }
.fila-nombre { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.fila-nombre input {
  flex: 1 1 160px; min-width: 0; background: var(--hundido); border: 0; box-shadow: inset 0 0 0 2px var(--borde);
  padding: 8px 10px; font-family: var(--f-titulo); font-size: 16px; color: var(--hueso);
}
.ed-linea { margin: 0; font-size: 16px; }
.ed-cifras { margin: 0; color: var(--ceniza); font-size: 14px; }
.ed-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 72px)); gap: 6px; }
.ed-stats div { display: grid; justify-items: center; padding: 4px 2px; background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde); }
.ed-stats b { font-family: var(--f-titulo); font-size: 18px; font-weight: 400; color: var(--hueso); }
.ed-stats span { font-family: var(--f-titulo); font-size: 11px; color: var(--barro-luz); }
.ed-stats small { font-size: 11px; color: var(--tenue); line-height: 1.1; text-align: center; }
.ed-bloque { display: grid; gap: 8px; }
.ed-desc { margin: 0; color: var(--ceniza); font-size: 15px; max-width: 70ch; }
.ed-desc b { color: var(--hueso); font-weight: 600; }
.rejilla-fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.opcion-ficha {
  display: grid; justify-items: center; gap: 2px; padding: 4px 2px 6px; border: 0;
  background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde); font-family: var(--f-titulo); font-size: 11px; color: var(--ceniza);
}
.opcion-ficha:hover { box-shadow: inset 0 0 0 2px var(--borde-luz); color: var(--hueso); }
.opcion-ficha[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--oro); background: var(--panel-2); color: var(--hueso); }
.rejilla-alin { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.alin, .peinado {
  border: 0; padding: 7px 6px; background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde);
  font-family: var(--f-titulo); font-size: 11px; color: var(--ceniza);
}
.alin[aria-pressed="true"], .peinado[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--oro); color: var(--hueso); background: var(--panel-2); }
.aspecto { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.muestras { display: flex; flex-wrap: wrap; gap: 4px; }
.muestra {
  width: 28px; height: 28px; border: 0; padding: 0;
  background: linear-gradient(135deg, var(--c1) 0 50%, var(--c2) 50% 100%);
  box-shadow: inset 0 0 0 2px var(--noche);
}
.muestra[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--noche), 0 0 0 2px var(--oro); }
.habilidades { margin: 0; display: grid; gap: 4px; }
.habilidades dt { font-family: var(--f-titulo); font-size: 12px; color: var(--oro); }
.habilidades dd { margin: 0 0 6px; color: var(--ceniza); font-size: 15px; }
.arranque { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: center; }
.reglas { padding: 10px 14px; }
.reglas summary { font-family: var(--f-titulo); font-size: 13px; color: var(--barro-luz); cursor: pointer; }
.reglas ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; color: var(--ceniza); }
.reglas b { color: var(--hueso); font-weight: 600; }
.online { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.bloque { padding: 14px; display: grid; gap: 10px; }
.bloque p { margin: 0; color: var(--ceniza); font-size: 15px; }
.unirse { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.unirse input {
  width: 8ch; background: var(--hundido); border: 0; box-shadow: inset 0 0 0 2px var(--borde);
  padding: 7px 10px; font-family: var(--f-titulo); font-size: 22px; letter-spacing: .15em; text-transform: uppercase;
}
.mesas { display: grid; gap: 6px; }
.mesa-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 6px 8px; box-shadow: inset 0 0 0 2px var(--borde); }
.mesa-fila b { font-family: var(--f-titulo); font-size: 18px; letter-spacing: .12em; color: var(--barro-luz); font-weight: 400; }
.mesa-fila span { flex: 1; min-width: 0; font-size: 14px; color: var(--ceniza); }
.aviso-fijo { padding: 12px 14px; color: var(--barro-luz); margin: var(--px); }
.sala { display: grid; gap: 14px; }
.sala-info { padding: 14px 16px; display: grid; gap: 10px; }
.sala-info > p { margin: 0; max-width: 60ch; color: var(--ceniza); }
.codigo { font-family: var(--f-titulo); font-size: clamp(54px, 10vw, 96px); line-height: 1; letter-spacing: .16em; color: var(--barro-luz) !important; text-shadow: 4px 4px 0 var(--barro-sombra); user-select: all; }
.asientos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.asiento { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde); }
.asiento div { flex: 1; min-width: 0; }
.asiento strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
.acciones-sala { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.punto { flex: none; width: 8px; height: 8px; background: var(--borde); box-shadow: 0 0 0 2px var(--noche); }
.punto.on { background: var(--exito); }

/* ---------- Pantalla de juego ---------- */
.juego {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px;
  padding-block: 8px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.juego > * { min-width: 0; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-width: 0; }
.logo-mini { margin: 0; font-family: var(--f-titulo); font-weight: 700; font-size: 16px; color: var(--barro-luz); text-shadow: 2px 2px 0 var(--barro-sombra); white-space: nowrap; }
.logo-mini span { color: var(--hueso); }
.capitulos { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.capitulos li { font-family: var(--f-titulo); font-size: 11px; padding: 4px 7px; color: var(--tenue); box-shadow: inset 0 0 0 2px var(--borde); white-space: nowrap; }
.capitulos li b { font-weight: 700; }
.capitulos li span { margin-left: 6px; }
.capitulos li.hecho { color: var(--barro-luz); box-shadow: inset 0 0 0 2px var(--barro-sombra); }
.capitulos li.actual { background: var(--barro); color: var(--noche); box-shadow: none; }
.herramientas { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; }
.chip-mesa { font-family: var(--f-titulo); font-size: 11px; color: var(--ceniza); margin-right: 6px; }
.chip-mesa b { color: var(--barro-luz); letter-spacing: .1em; font-weight: 400; }
.confirmar { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 14px; color: var(--ceniza); }
.tablero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(340px, 1fr); gap: 12px; min-height: 0; }
.izquierda { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.pie-izq { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(250px, 0.85fr) minmax(0, 1.15fr); gap: 6px; }
.derecha { display: flex; min-height: 0; min-width: 0; }
.derecha .escena { flex: 1; }
.grupo { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 6px; }
.heroe {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; min-width: 0;
  background: var(--panel); border: 0; padding: 4px 10px 4px 4px; box-shadow: inset 0 0 0 2px var(--borde);
}
.heroe:hover { box-shadow: inset 0 0 0 2px var(--borde-luz); }
.heroe.activo { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--oro); }
.heroe.caido { opacity: .55; }
.heroe .retrato { --tam: 60; background: var(--hundido); }
.heroe-datos { display: grid; gap: 2px; min-width: 0; }
.heroe-datos strong, .heroe-datos .etiqueta { line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heroe-datos strong { font-weight: 600; }
.tu { font-family: var(--f-titulo); font-size: 10px; color: var(--noche); background: var(--oro); padding: 0 3px; vertical-align: 2px; }
.barra-alma { display: block; height: 8px; background: var(--hundido); box-shadow: inset 0 0 0 1px var(--noche); }
.barra-alma i { display: block; height: 100%; background: var(--exito); box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, .25); transition: width .3s steps(6); }
.heroe.grave .barra-alma i { background: var(--fallo); }
.cifras { font-size: 13px; color: var(--ceniza); font-variant-numeric: tabular-nums; line-height: 1.2; }
.escena { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.escena h2 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: 20px; line-height: 1.15; color: var(--barro-luz); text-shadow: 2px 2px 0 var(--barro-sombra); }
.texto { display: grid; gap: 8px; max-width: 66ch; }
.texto p { margin: 0; }
.quien { margin: 0; font-size: 15px; color: var(--ceniza); }
.quien b { color: var(--hueso); font-weight: 600; }
.saludo { margin: 0; font-size: 15px; color: var(--ceniza); font-style: italic; }
.saludo b { font-style: normal; color: var(--oro); font-weight: 600; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.menu.acciones { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opcion {
  width: 100%; height: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left;
  background: var(--hundido); border: 0; padding: 8px 10px; font-size: 15px; line-height: 1.3; color: var(--hueso);
  box-shadow: inset 0 0 0 2px var(--borde);
}
.opcion .cursor { font-family: var(--f-titulo); color: var(--oro); visibility: hidden; }
.opcion:hover:not(:disabled), .opcion:focus-visible { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--barro); }
.opcion:hover:not(:disabled) .cursor, .opcion:focus-visible .cursor { visibility: visible; animation: parpadeo .9s steps(2) infinite; }
.opcion:disabled { opacity: .5; }
.opcion small { display: block; color: var(--ceniza); font-size: 13px; line-height: 1.25; margin-top: 2px; }
.opcion .chip { font-family: var(--f-titulo); font-size: 11px; color: var(--barro-luz); white-space: nowrap; text-align: right; }
.op-txt { min-width: 0; }
.op-txt .etiqueta { font-size: 10px; margin-left: 4px; }
.sello { margin: 0; align-self: flex-start; font-family: var(--f-titulo); font-size: 16px; padding: 4px 10px; box-shadow: inset 0 0 0 2px currentColor; }
.sello.ok { color: var(--exito); }
.sello.ko { color: var(--fallo); }
.linea-tirada { margin: 0; font-family: var(--f-titulo); font-size: 11px; line-height: 1.5; color: var(--ceniza); }
.efectos { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.efectos li { font-family: var(--f-titulo); font-size: 11px; padding: 3px 7px; color: var(--hueso); box-shadow: inset 0 0 0 2px var(--borde); }
.pie-escena { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: auto; padding-top: 4px; }
.epilogo { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ceniza); }
.epilogo b { color: var(--hueso); }
.rival-info { display: grid; gap: 4px; }
.rival-nombre { justify-self: start; background: none; border: 0; padding: 0; font-family: var(--f-titulo); font-size: 15px; color: var(--fallo); text-decoration: underline dotted; text-underline-offset: 4px; }
.rasgos { display: flex; flex-wrap: wrap; gap: 4px; }
.rasgos span { font-family: var(--f-titulo); font-size: 10px; padding: 3px 6px; color: var(--ceniza); box-shadow: inset 0 0 0 2px var(--borde); }
.rasgos .alerta { color: var(--oro); box-shadow: inset 0 0 0 2px var(--barro-sombra); }
.rasgo-desc { margin: 0; font-size: 14px; color: var(--ceniza); }
.orden { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px; counter-reset: ini; }
.orden li { font-family: var(--f-titulo); font-size: 10px; padding: 3px 6px; color: var(--tenue); background: var(--hundido); counter-increment: ini; }
.orden li::before { content: counter(ini) ". "; }
.orden li.rival { color: var(--fallo); }
.orden li.caido { text-decoration: line-through; }
.orden li.ahora { background: var(--oro); color: var(--noche); }
.mesa { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; align-content: center; gap: 10px; padding: 6px 12px 6px 8px; min-height: 0; }
.dado { width: 64px; height: 64px; background: transparent; }
.dado[data-estado="critico"] { filter: drop-shadow(0 0 4px var(--oro)); }
.mesa-info { display: grid; gap: 6px; min-width: 0; }
#dado-info { margin: 0; font-size: 14px; line-height: 1.3; }
#dado-info.ok { color: var(--exito); }
#dado-info.ko { color: var(--fallo); }
.libres { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.libres button { border: 0; padding: 3px 6px; background: var(--hundido); box-shadow: inset 0 0 0 2px var(--borde); font-family: var(--f-titulo); font-size: 10px; color: var(--ceniza); }
.libres button:hover { color: var(--hueso); box-shadow: inset 0 0 0 2px var(--borde-luz); }
.solo-movil { display: none; }
.cronica { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.cronica h3 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: 11px; color: var(--tenue); }

  class Rejilla {
    constructor(w = 36, h = 36) {

      this.c = new Array(w * h).fill(null);

      if (!this.dentro(x, y)) return this;
      this.c[y * this.w + x] = color; this.r[y * this.w + x] = rampa;

      x = Math.round(x); y = Math.round(y);
      if (this.dentro(x, y)) { this.c[y * this.w + x] = null; this.r[y * this.w + x] = null; }

      o.c = this.c.slice(); o.r = this.r.slice();

    espejo() {
      const o = new Rejilla(this.w, this.h);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        o.c[y * this.w + (this.w - 1 - x)] = this.c[y * this.w + x];
        o.r[y * this.w + (this.w - 1 - x)] = this.r[y * this.w + x];

    tumbada() {
      const o = new Rejilla(this.h, this.w);

    c.linea(t.cx - 2, t.pierTop, t.cx - 3, t.suelo - 2, 2);
    c.linea(t.cx + 2, t.pierTop, t.cx + 3, t.suelo - 2, 2);
    c.pintar(g, piel, { relieve: 1.5 });
    const grande = raza === "mediano";
    const p = new Capa().rect(t.cx - 5, t.suelo - 1, grande ? 4 : 3, 2).rect(t.cx + 2, t.suelo - 1, grande ? 5 : 4, 2);
    p.pintar(g, grande ? piel : piel, { relieve: 1 });
    if (!grande) {
      for (let x = t.cx - 5; x <= t.cx + 5; x++) if (g.rampa(x, t.suelo) === piel) g.set(x, t.suelo, pie[2], pie);
      g.set(t.cx - 3, t.suelo - 1, pie[1], pie).set(t.cx + 3, t.suelo - 1, pie[1], pie);
      if (calzado === "alto") for (let y = t.suelo - 5; y < t.suelo - 1; y += 2) { g.set(t.cx - 3, y, pie[2], pie); g.set(t.cx + 3, y, pie[2], pie); }
    } else {
      g.set(t.cx - 4, t.suelo - 1, pelo[2], pelo).set(t.cx + 4, t.suelo - 1, pelo[2], pelo);
    }
  }
  function cola(g, t, piel, raza) {
    if (raza === "tiefling") {
      new Capa().curva(t.torL + 1, t.torBot - 1, t.torL - 7, t.torBot + 7, t.torL - 6, t.torBot - 3, 2, 1.2).pintar(g, piel, { relieve: 1 });
      new Capa().poly([[t.torL - 8, t.torBot - 3], [t.torL - 6, t.torBot - 7], [t.torL - 4, t.torBot - 3]]).pintar(g, piel, { relieve: 1, min: 2 });
    }
    if (raza === "draconido") new Capa().curva(t.torL + 2, t.torBot - 2, t.torL - 3, t.suelo + 1, t.torL - 9, t.suelo - 1, 4.5, 1.5).pintar(g, piel, { relieve: 2 });
  }

  /* ---------- Ropa, tocados y objetos de cada clase ---------- */
  const falda = (t, largo, vuelo) => new Capa().poly([[t.torL, t.torBot - 1], [t.torR + 1, t.torBot - 1], [t.torR + 1 + vuelo, t.pierTop + largo], [t.torL - vuelo, t.pierTop + largo]]);
  const torso = t => new Capa().rect(t.torL, t.torTop, t.torR - t.torL + 1, t.torBot - t.torTop + 1).off(t.torL, t.torTop).off(t.torR, t.torTop);

  function espalda(g, t, clase, tela) {
    if (clase === "cazadora") {
      new Capa().linea(t.torL + 1, t.torTop - 2, t.torL - 1, t.torBot - 2, 3).pintar(g, R.madera, { relieve: 1.5 });
      [[t.torL + 2, t.torTop - 4], [t.torL, t.torTop - 4], [t.torL + 1, t.torTop - 5]].forEach(([x, y], i) => {
        g.set(x, y, i === 2 ? R.tela.granate[3] : R.hueso[4], R.hueso).set(x, y + 1, R.hueso[2], R.hueso);
      });
    }
    if (clase === "rapsoda") new Capa().poly([[t.torL + 1, t.torTop], [t.torL + 3, t.torTop], [t.torL - 1, t.pierTop + 5], [t.torL - 5, t.pierTop + 4]]).pintar(g, tela, { relieve: 2, max: 2 });
    if (clase === "sofista") new Capa().poly([[t.torL + 1, t.torTop], [t.torL + 4, t.torTop], [t.torL + 1, t.torBot + 1], [t.torL - 3, t.torBot]]).pintar(g, tela, { relieve: 2, max: 2 });
  }

  function vestir(g, t, clase, tela, piel) {
    const T = torso(t);
    switch (clase) {
      case "filosofo": {
        T.unir(falda(t, t.suelo - t.pierTop - 2, 2)).pintar(g, tela, { relieve: 3 });
        new Capa().linea(t.torR, t.torTop + 1, t.torL, t.torBot + 2, 1).recortar(T).pintar(g, tela, { plano: 1 });
        new Capa().linea(t.torR - 1, t.torTop + 3, t.torL + 2, t.pierTop + 5, 1).pintar(g, tela, { plano: 1 });
        g.set(t.cx + 1, t.torTop, R.hueso[3], R.hueso).set(t.cx + 2, t.torTop, R.hueso[3], R.hueso);
        break;
      }
      case "guardian": {
        falda(t, 3, 1).pintar(g, tela, { relieve: 2 });
        for (let x = t.torL - 1; x <= t.torR + 1; x += 2) for (let y = t.torBot; y <= t.pierTop + 3; y++) if (g.rampa(x, y) === tela) g.set(x, y, tela[1], tela);
        T.pintar(g, R.bronce, { relieve: 3, separar: true });
        for (let y = t.torTop + 3; y < t.torBot - 1; y++) g.set(t.cx + 1, y, R.bronce[1], R.bronce);
        g.set(t.cx - 1, t.torTop + 4, R.bronce[1], R.bronce).set(t.cx + 3, t.torTop + 4, R.bronce[1], R.bronce);
        for (let x = t.torL; x <= t.torR; x++) g.set(x, t.torBot - 1, R.bronce[1], R.bronce);
        break;
      }
      case "sofista": {
        T.unir(falda(t, 4, 1)).pintar(g, tela, { relieve: 3 });
        for (let x = t.torL - 1; x <= t.torR + 2; x++) if (g.rampa(x, t.pierTop + 4) === tela) g.set(x, t.pierTop + 4, R.bronce[3], R.bronce);
        for (let x = t.cx - 1; x <= t.cx + 2; x++) g.set(x, t.torTop, R.bronce[3], R.bronce);
        g.set(t.cx + 2, t.torTop + 1, R.bronce[4], R.bronce);
        break;
      }
      case "rapsoda": {
        T.unir(falda(t, 4, 1)).pintar(g, tela, { relieve: 3 });
        for (let x = t.torL; x <= t.torR; x++) g.set(x, t.torBot - 3, R.madera[2], R.madera);
        g.set(t.cx + 2, t.torBot - 3, R.bronce[4], R.bronce);
        break;
      }
      case "atleta": {
        T.pintar(g, piel, { relieve: 3 });
        g.set(t.cx - 1, t.torTop + 3, piel[1], piel).set(t.cx, t.torTop + 3, piel[1], piel).set(t.cx + 2, t.torTop + 3, piel[1], piel).set(t.cx + 3, t.torTop + 3, piel[1], piel);
        for (let y = t.torTop + 5; y < t.torBot - 2; y += 2) g.set(t.cx + 1, y, piel[1], piel);
        new Capa().poly([[t.torL, t.torBot - 2], [t.torR + 1, t.torBot - 2], [t.torR + 1, t.pierTop + 1], [t.cx + 1, t.pierTop + 3], [t.torL, t.pierTop + 1]]).pintar(g, tela, { relieve: 2, separar: true });
        break;
      }
      case "oraculo": {
        T.unir(falda(t, t.suelo - t.pierTop - 2, 2)).pintar(g, R.tela.blanco, { relieve: 3 });
        new Capa().linea(t.torR - 1, t.torTop, t.torR - 2, t.suelo - 3, 2).recortar(T.copia().unir(falda(t, t.suelo - t.pierTop - 2, 2))).pintar(g, tela, { relieve: 1 });
        for (let x = t.torL; x <= t.torR; x++) g.set(x, t.torBot - 3, R.bronce[3], R.bronce);
        g.set(t.cx + 1, t.torTop + 3, R.bronce[4], R.bronce).set(t.cx + 1, t.torTop + 2, R.bronce[3], R.bronce);
        break;
      }
      case "cazadora": {
        T.unir(falda(t, 2, 1)).pintar(g, tela, { relieve: 3 });
        new Capa().linea(t.torL + 1, t.torTop, t.torR, t.torBot - 3, 1).recortar(T).pintar(g, R.madera, { plano: 2 });
        for (let x = t.torL; x <= t.torR; x++) g.set(x, t.torBot - 2, R.madera[1], R.madera);
        break;
      }
      case "hechicero": {
        T.unir(falda(t, t.suelo - t.pierTop - 2, 3)).pintar(g, tela, { relieve: 3 });
        for (let y = t.torTop + 2; y < t.suelo - 2; y += 3) g.set(t.cx + 1, y, tela[1], tela);
        for (let x = t.torL; x <= t.torR; x++) g.set(x, t.torBot - 3, R.tela.negro[2], R.tela.negro);
        g.set(t.cx + 2, t.torBot - 2, R.bronce[3], R.bronce).set(t.cx + 2, t.torBot - 1, R.bronce[2], R.bronce);
        break;
      }
      default:
        T.unir(falda(t, 3, 1)).pintar(g, tela, { relieve: 3 });
    }
  }
  /* Grebas de bronce del guardián, encima de las piernas. */
  function grebas(g, t) {
    new Capa().rect(t.cx - 4, t.pierTop + 3, 2, t.suelo - t.pierTop - 4).rect(t.cx + 2, t.pierTop + 3, 2, t.suelo - t.pierTop - 4).pintar(g, R.bronce, { relieve: 1 });
  }

  function tocado(g, t, clase, tela, raza, peinado) {
    const enCorona = (ram, joya) => {
      const c = new Capa();
      for (let x = t.cabX - 5; x <= t.cabX + 3; x++) c.on(x, t.cabY - 4 + (x < t.cabX - 3 ? 1 : 0) + (x > t.cabX + 1 ? 1 : 0));
      c.pintar(g, ram, { relieve: 1, min: 2 });
      for (let x = t.cabX - 4; x <= t.cabX + 2; x += 2) g.set(x, t.cabY - 5 + (x > t.cabX + 1 ? 1 : 0), ram[3], ram);
      if (joya) g.set(t.cabX + 3, t.cabY - 3, joya[4], joya);
    };
    switch (clase) {
      case "guardian": {
        const casco = new Capa().ell(t.cabX - 0.2, t.cabY - 0.8, t.cabRx + 0.9, t.cabRy + 0.4);
        casco.quitarRect(t.cabX, t.cabY - 1, 5, 3);
        casco.off(t.cabX + 3, t.cabY + 4); casco.off(t.cabX + 4, t.cabY + 4);
        casco.quitarRect(0, t.cabY + 5, 36, 36);
        casco.pintar(g, R.bronce, { relieve: 3 });
        for (let y = t.cabY - 1; y <= t.cabY + 2; y++) g.set(t.cabX + 3, y, R.bronce[2], R.bronce);
        new Capa().curva(t.cabX + 3, t.cabY - 6, t.cabX - 3, t.cabY - 11, t.cabX - 9, t.cabY - 1, 3.2, 2.2).pintar(g, R.tela.granate, { relieve: 1.5, separar: true });
        break;
      }
      case "hechicero": {
        const capucha = new Capa().ell(t.cabX - 0.8, t.cabY - 0.4, t.cabRx + 1.3, t.cabRy + 1.2);
        capucha.poly([[t.cabX - 6, t.cabY], [t.cabX - 1, t.cabY + 4], [t.torL, t.torTop + 2], [t.cabX - 8, t.torTop + 1]]);
        for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++) if (x >= t.cabX && y >= t.cabY - 2 && y <= t.cabY + 4) capucha.off(x, y);
        capucha.pintar(g, tela, { relieve: 2.5, separar: true });
        break;
      }
      case "oraculo": {
        const velo = new Capa().ell(t.cabX - 1, t.cabY - 1.2, t.cabRx + 0.6, t.cabRy);
        for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++) if (x >= t.cabX - 2 && y >= t.cabY - 3) velo.off(x, y);
        velo.poly([[t.cabX - 6, t.cabY - 2], [t.cabX - 3, t.cabY - 2], [t.cabX - 3, t.torTop + 3], [t.cabX - 8, t.torTop + 4]]);
        velo.pintar(g, tela, { relieve: 2, separar: true });
        enCorona(R.bronce, R.fuego);
        break;
      }
      case "rapsoda":
      case "atleta":
        enCorona(R.hoja);
        break;
      case "sofista":
        for (let x = t.cabX - 4; x <= t.cabX + 3; x++) g.set(x, t.cabY - 3 + (x > t.cabX + 1 ? 1 : 0), R.bronce[3], R.bronce);
        break;
      case "cazadora":
        g.set(t.cabX + 2, t.cabY - 3, R.plata[4], R.plata).set(t.cabX + 1, t.cabY - 4, R.plata[3], R.plata).set(t.cabX + 3, t.cabY - 4, R.plata[3], R.plata);
        break;
    }
  }

  function objeto(g, t, clase, tela) {
    const [mx, my] = t.mano;
    switch (clase) {
      case "filosofo": {
        new Capa().rect(mx - 2, my - 1, 6, 3).pintar(g, R.hueso, { relieve: 1.5 });
        g.set(mx + 3, my - 1, R.hueso[1], R.hueso).set(mx + 3, my, R.hueso[2], R.hueso).set(mx + 3, my + 1, R.hueso[1], R.hueso);
        g.set(mx + 1, my, R.madera[1], R.madera).set(mx + 2, my, R.madera[1], R.madera);
        break;
      }
      case "guardian": {
        new Capa().rect(mx, 3, 1, t.suelo - 3).pintar(g, R.madera, { plano: 2 });
        new Capa().poly([[mx, -0.5], [mx + 1.6, 3.5], [mx - 1.6, 3.5]]).pintar(g, R.bronce, { relieve: 1, min: 2 });
        const cx = t.torR + 1, cy = t.torTop + 6;
        new Capa().ell(cx, cy, 5.6, 6.2).pintar(g, R.bronce, { relieve: 2, separar: true });
        new Capa().ell(cx, cy, 4.4, 5).pintar(g, tela, { relieve: 4 });
        [[0, -2], [-1, -1], [1, -1], [-1, 0], [1, 0], [-2, 1], [2, 1], [-2, 2], [2, 2]].forEach(([a, b]) => g.set(cx + a, cy + b, R.hueso[4], R.hueso));
        break;
      }
      case "sofista": {
        new Capa().ell(mx + 1, my + 2.5, 2, 2.2).on(mx + 1, my).pintar(g, R.tela.ocre, { relieve: 2 });
        g.set(mx + 1, my + 1, R.madera[1], R.madera).set(mx + 2, my + 2, R.bronce[4], R.bronce);
        break;
      }
      case "rapsoda": {
        const marco = new Capa().curva(mx - 1, my + 1, mx - 3, my - 3, mx - 1, my - 6, 2, 1.5).curva(mx + 3, my + 1, mx + 5, my - 3, mx + 3, my - 6, 2, 1.5);
        marco.linea(mx - 1, my - 6, mx + 3, my - 6, 1);
        marco.pintar(g, R.bronce, { relieve: 1, min: 2 });
        for (let y = my - 5; y <= my; y++) { g.set(mx, y, R.hueso[4]); g.set(mx + 2, y, R.hueso[4]); }
        new Capa().ell(mx + 1, my + 2, 2.6, 1.6).pintar(g, R.madera, { relieve: 1.5, separar: true });
        break;
      }
      case "atleta": {
        new Capa().rect(mx - 1, my - 1, 3, 3).pintar(g, R.hueso, { relieve: 1 });
        break;
      }
      case "oraculo": {
        new Capa().rect(mx, 6, 1, t.suelo - 6).pintar(g, R.madera, { plano: 2 });
        new Capa().ell(mx, 4, 2.3, 2.3).pintar(g, R.bronce, { relieve: 2, min: 2 });
        [[0, -4], [0, 8], [-4, 4], [4, 4], [-3, 1], [3, 1]].forEach(([a, b]) => g.set(mx + a, b, R.bronce[4], R.bronce));
        g.set(mx, 4, R.fuego[4], R.fuego);
        break;
      }
      case "cazadora": {
        new Capa().curva(mx + 1, t.torTop - 4, mx + 6, my, mx + 1, t.torBot + 4, 1.6, 1.6).pintar(g, R.madera, { relieve: 1, min: 2 });
        for (let y = t.torTop - 3; y <= t.torBot + 3; y++) if (!g.get(mx + 1, y) || g.rampa(mx + 1, y) !== R.madera) g.set(mx + 1, y, R.hueso[3], R.hueso);
        break;
      }
      case "hechicero": {
        new Capa().rect(mx, my - 4, 1, 6).pintar(g, R.madera, { plano: 2 });
        new Capa().ell(mx, my - 6.5, 1.8, 2.6).on(mx, my - 9.5).pintar(g, R.magia, { relieve: 1.5, min: 2 });
        g.set(mx, my - 6, R.magia[4], R.magia).set(mx, my - 5, R.magia[4], R.magia);
        break;
      }
    }
    return [mx, my];
  }

  /* Objetos extra para personajes no jugadores (los dibuja el bestiario). */
  const OBJETOS_EXTRA = {
    martillo(g, t) {
      const [mx, my] = t.mano;
      new Capa().rect(mx, my - 7, 1, 9).pintar(g, R.madera, { plano: 2 });
      new Capa().rect(mx - 2, my - 10, 5, 4).pintar(g, R.hierro, { relieve: 1.5 });
    },
    caduceo(g, t) {
      const [mx, my] = t.mano;
      new Capa().rect(mx, 5, 1, t.suelo - 5).pintar(g, R.bronce, { plano: 3 });
      new Capa().ell(mx, 4, 1.4, 1.4).pintar(g, R.bronce, { relieve: 1, min: 3 });
      for (let y = 8; y < 18; y++) g.set(mx + ((y >> 1) % 2 ? 1 : -1), y, R.hoja[3], R.hoja);
      g.set(mx - 2, 5, R.hueso[4]).set(mx + 2, 5, R.hueso[4]).set(mx - 3, 4, R.hueso[3]).set(mx + 3, 4, R.hueso[3]);
    },
    copa(g, t) {
      const [mx, my] = t.mano;
      new Capa().rect(mx - 2, my - 3, 5, 2).pintar(g, R.oricalco, { relieve: 1, min: 2 });
      g.set(mx, my - 1, R.oricalco[2], R.oricalco).set(mx - 1, my - 4, R.sangre[3], R.sangre).set(mx + 1, my - 4, R.sangre[3], R.sangre);
    },
    odre(g, t) {
      const [mx, my] = t.mano;
      new Capa().ell(mx + 1, my + 1, 3, 2.4).pintar(g, R.madera, { relieve: 2 });
      g.set(mx + 4, my, R.madera[1], R.madera);
    },
    cayado(g, t) {
      const [mx, my] = t.mano;
      new Capa().rect(mx, 6, 1, t.suelo - 6).curva(mx, 6, mx + 1, 2, mx + 4, 4, 1, 1).pintar(g, R.madera, { relieve: 1, min: 2 });
    },
    anillo(g, t) {
      const [mx, my] = t.mano;
      g.set(mx + 1, my - 2, R.bronce[4], R.bronce).set(mx + 2, my - 2, R.bronce[3], R.bronce).set(mx + 1, my - 3, R.bronce[3], R.bronce).set(mx + 2, my - 3, R.bronce[4], R.bronce);
      g.set(mx + 3, my - 4, R.hueso[4]).set(mx, my - 4, R.hueso[4]);
    },
    balanza(g, t) {
      const [mx, my] = t.mano;
      new Capa().rect(mx, my - 6, 1, 6).rect(mx - 3, my - 6, 7, 1).pintar(g, R.bronce, { plano: 3 });
      new Capa().rect(mx - 4, my - 3, 3, 1).rect(mx + 2, my - 3, 3, 1).pintar(g, R.bronce, { plano: 2 });
    }
  };

  function componer(a = {}) {
    const raza = RAZAS[a.raza] ? a.raza : "humano";
    const vis = RAZAS[raza];
    const clase = a.clase || "filosofo";
    const t = plantilla(a.cuerpo || vis.cuerpo);
    const piel = R.piel[a.piel] || R.piel[vis.pieles[0]];
    const ramPelo = R.pelo[a.pelo] || R.pelo[vis.pelos[0] || "negro"];
    const tela = R.tela[a.tela] || R.tela[TELA_CLASE[clase]] || R.tela.terracota;
    const peinado = vis.sinPelo ? "rapado" : (a.peinado || "corto");
    const g = new Rejilla(36, 36);
    const tapaPelo = clase === "guardian" || clase === "hechicero";

    cola(g, t, piel, raza);
    espalda(g, t, clase, tela);
    const manga = ["filosofo", "oraculo", "hechicero"].includes(clase) ? (clase === "oraculo" ? R.tela.blanco : tela) : null;
    brazo(g, t, piel, manga, false);
    const largas = ["filosofo", "oraculo", "hechicero"].includes(clase);
    if (!largas || raza === "satiro") piernas(g, t, piel, raza, ramPelo, clase === "cazadora" ? "alto" : null);
    else {
      const pies = new Capa().rect(t.cx - 5, t.suelo - 1, 3, 2).rect(t.cx + 2, t.suelo - 1, 4, 2);
      pies.pintar(g, raza === "draconido" ? piel : R.madera, { relieve: 1 });
    }
    if (clase === "guardian" && raza !== "satiro") grebas(g, t);
    vestir(g, t, clase, tela, piel);
    if (raza === "draconido") cabezaDraconido(g, t, piel);
    else cabeza(g, t, piel);
    if (!tapaPelo) pelo(g, t, ramPelo, peinado, raza);
    if (raza !== "draconido") oreja(g, t, piel, raza);
    if ((a.barba || vis.barba) && raza !== "draconido" && clase !== "guardian") barba(g, t, ramPelo, !!vis.barba);
    tocado(g, t, clase, tela, raza, peinado);
    if (clase !== "guardian") cuernos(g, t, raza);
    else if (raza === "tiefling") cuernos(g, t, raza);
    if (raza !== "draconido") cara(g, t, piel, raza, clase === "hechicero");
    if (a.objeto && OBJETOS_EXTRA[a.objeto]) OBJETOS_EXTRA[a.objeto](g, t);
    else if (a.objeto !== "ninguno") objeto(g, t, clase, tela);
    brazo(g, t, piel, manga, true);
    if (clase === "atleta") new Capa().rect(t.mano[0] - 1, t.mano[1] - 1, 2, 2).pintar(g, R.hueso, { relieve: 1, separar: true });
    if (a.extras) a.extras.forEach(fn => fn(g, t, { piel, pelo: ramPelo, tela }));
    if (!a.sinContorno) g.contorno();
    return a.espejo ? g.espejo() : g;
  }

  function doxa() {
    const g = new Rejilla(), G = R.piel.gris, V = R.piel.violeta, S = R.sombra;
    const nubes = (lista, ram, op) => lista.forEach(([x, y, rx, ry = rx]) => new Capa().ell(x, y, rx, ry).pintar(g, ram, op));
    const fondo = new Capa().ell(18, 18.5, 12.5, 11);
    [[8, 9, 5], [17.5, 6, 5.3], [27, 8, 5], [4.5, 17, 3.6], [31.5, 16.5, 3.4], [5.5, 25, 4], [30, 24.5, 4], [12.5, 29, 4.4], [22.5, 29.5, 4.4]].forEach(([x, y, r]) => fondo.ell(x, y, r, r));
    fondo.curva(6, 28, 3, 31, 2, 34, 3, 1).curva(13, 32, 11, 34, 8, 34, 2.6, 1).curva(27, 31, 30, 33, 33, 34, 2.6, 1);
    fondo.quitarRect(0, 0, 36, 1).quitarRect(0, 35, 36, 1).quitarRect(0, 0, 1, 36).quitarRect(35, 0, 1, 36);
    fondo.pintar(g, S, { relieve: 3, min: 2 });
    nubes([[27, 8.5, 4.5, 4.2], [31, 16.5, 2.8, 3.2], [29.5, 24.5, 3.8, 3.6], [22.5, 29, 4.2, 3.6], [12.5, 28.5, 4.2, 3.6], [5.5, 24.5, 3.4, 3.4], [17.5, 23.5, 5, 4]], V, { relieve: 3, separar: true });
    nubes([[8, 9.5, 4.4, 4], [17.5, 6.5, 4.6, 4.2], [12, 14.5, 5, 4], [23, 13.5, 4.8, 4], [5, 17, 2.8, 3], [16.5, 19.5, 4.6, 3.5], [26.5, 20, 3.4, 2.8]], G, { relieve: 3, separar: true });
    nubes([[18.5, 11.5, 2.4, 2], [3.8, 13, 1.6, 1.8]], V, { relieve: 2, separar: true });
    /* Ojos: los grandes, almendrados con pupila de 2×2; los pequeños, de 3×2 con pupila de un píxel. */
    const ojo = (x, y, rx, ry, dx, dy) => {
      new Capa().ell(x, y, rx, ry).pintar(g, HUESO, { relieve: 1.5, min: 3, separar: 2 });
      const px = Math.round(x + dx - 0.5), py = Math.round(y + dy - 0.5);

      new Capa().rect(x, y, 3, 2).pintar(g, HUESO, { relieve: 1, min: 3, separar: 2 });

    ojo(12, 14.5, 2.6, 1.6, -1, 0); ojo(23, 13.5, 2.2, 1.4, 1, -0.5); ojo(16.5, 19.5, 2, 1.3, 0, 0.6);
    ojito(4, 16, -1, 1); ojito(25, 19, 1, 1); ojito(16, 5, 0, 0); ojito(7, 8, -1, 1); ojito(27, 7, 1, 0); ojito(28.5, 23.5, 0, 1); ojito(4, 24, -1, 0); ojito(21, 28, 1, 1);
    pon(g, G, 4, [9, 12], [10, 11], [11, 11], [21, 10], [22, 10], [23, 10]);
    pon(g, V, 4, [27, 26], [28, 27], [29, 27], [31, 14], [31, 15], [15, 23], [16, 23]);
    pon(g, S, 0, [14, 24], [15, 25], [16, 25], [17, 25], [18, 25], [19, 24]);
    pon(g, HUESO, 3, [15, 25], [17, 25]);
    pon(g, S, 0, [11, 28], [12, 28], [11, 29], [12, 29]);
    pon(g, S, 0, [24, 22], [25, 22], [26, 21]);
    return g.contorno();
  }

  /* ---------- Personajes no jugadores ---------- */
  /* Una clase que heroes.js no conoce viste una túnica lisa, sin tocado ni objeto propio. */
  const LLANO = "llano";
  /* PNJ con cuerpo de héroe, mirando a la izquierda. «encima» pinta antes del contorno y «brillo» después
     (destellos sin borde). Las dos reciben las coordenadas del héroe, que mira a la derecha. */
  function pnj(aspecto, encima, brillo) {
    const g = HEROES.componer({ ...aspecto, extras: encima ? [encima] : [], sinContorno: true });
    g.contorno();
    if (brillo) brillo(g, HEROES.plantilla(aspecto.cuerpo || HEROES.RAZAS[aspecto.raza].cuerpo));
    return g.espejo();
  }
  /* Destello de cuatro puntas, sin contorno. */
  const destello = (g, x, y) => { pon(g, R.bronce, 4, [x, y]); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => { if (!g.get(x + a, y + b)) pon(g, HUESO, 4, [x + a, y + b]); }); };

  /* Nota musical de 4×5 (cabeza de 2×2, plica y corchete). */
  const nota = (g, x, y, ram, i) => pon(g, ram, i, [x, y + 3], [x + 1, y + 3], [x, y + 4], [x + 1, y + 4], [x + 1, y], [x + 1, y + 1], [x + 1, y + 2], [x + 2, y], [x + 3, y + 1]);

  function sirena() {
    const g = new Rejilla(), P = R.piel.clara, Pe = R.pelo.cobrizo, Pi = R.piedra, Ma = R.mar, Es = R.piel.esmeralda;

    roca.pintar(g, Pi, { relieve: 3 });
    [[17, 29, 20, 31], [26, 24, 27, 28], [9, 32, 12, 31]].forEach(([x0, y0, x1, y1]) => new Capa().linea(x0, y0, x1, y1, 1).recortar(roca).pintar(g, Pi, { plano: 1 }));
    for (let x = 8; x <= 33; x++) if (g.rampa(x, 34) === Pi && x % 3 !== 1) pon(g, Ma, x % 3 ? 4 : 3, [x, 34]);
    const pelo = new Capa().ell(24.5, 8, 4.6, 4.4).poly([[23, 8], [28.5, 7], [30.5, 14], [30, 21], [27.5, 23.5], [26, 16]]);

    cola.pintar(g, Ma, { relieve: 2.5, separar: true });
    for (let y = 17; y <= 30; y++) for (let x = 6; x <= 27; x++)
      if (g.rampa(x, y) === Ma && (x + 2 * y) % 4 === 0 && g.get(x, y) !== Ma[1]) pon(g, Es, 4, [x, y]);
    new Capa().poly([[9.5, 27], [3.5, 24], [5.5, 28.5], [3, 32.5], [10, 30]]).pintar(g, Es, { relieve: 1.5, separar: true });
    pon(g, Es, 2, [5, 26], [6, 27], [5, 31], [6, 30]);
    const torso = new Capa().poly([[21.5, 14], [26.5, 14], [26, 18], [25.5, 22], [22, 22], [22, 18]]);
    torso.pintar(g, P, { relieve: 2.5, separar: true });
    new Capa().rect(23, 12, 2, 3).pintar(g, P, { relieve: 1, max: 2 });
    pon(g, HUESO, 3, [22, 17], [24, 17]);
    pon(g, HUESO, 4, [23, 17], [25, 17]);
    new Capa().linea(22.5, 15, 20.5, 19, 2).linea(20.5, 19, 18, 20, 2).pintar(g, P, { relieve: 1.5, separar: true });
    const cab = new Capa().ell(22.5, 8.5, 4, 4.2).on(18, 9.5);
    cab.pintar(g, P, { relieve: 3, separar: true });
    new Capa().ell(24, 5.8, 3.6, 2).poly([[24, 6], [27, 6], [27.5, 13], [26, 13]]).pintar(g, Pe, { relieve: 2, separar: true });
    pon(g, NEGRO, 1, [21, 8], [21, 9], [19, 8], [19, 9]);
    pon(g, HUESO, 4, [22, 9], [20, 9]);
    pon(g, P, 1, [20, 7], [21, 7], [18, 7]);
    pon(g, R.sangre, 2, [19, 11], [20, 11]);
    nota(g, 11, 3, HUESO, 4);
    nota(g, 5, 9, HUESO, 3);
    return g.contorno();
  }

  const PNJS = {

      for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++)
        if ((x >= t.cabX - 1 && y > t.ojoY - 3) || (x < t.cabX - 1 && y > t.cabY - 1)) pa.off(x, y);
      pa.ell(t.cabX - 6, t.cabY - 1.5, 1.6, 1.6).linea(t.cabX - 6, t.cabY - 1, t.cabX - 8, t.cabY + 4, 2).linea(t.cabX - 6, t.cabY, t.cabX - 6, t.cabY + 5, 1);

      const x = t.cabX, y = t.ojoY;

    sileno: () => pnj({ raza: "satiro", clase: "atleta", cuerpo: "fornido", piel: "clara", pelo: "castano", peinado: "rapado", tela: "violeta", objeto: "ninguno" }, (g, t, { piel }) => {
      const cuerno = R.pelo.castano;
      for (let y = 0; y < t.cabY - 2; y++) for (let x = 0; x < 36; x++)
        if (g.rampa(x, y) === HUESO) g.set(x, y, cuerno[Math.min(4, HUESO.indexOf(g.get(x, y)) + 1)], cuerno);
      new Capa().ell(t.cx + 1.5, t.torTop + 7, 5, 4.6).pintar(g, piel, { relieve: 4, separar: true });

    }),
    diotima: () => pnj({ raza: "humano", clase: "filosofo", piel: "oliva", pelo: "negro", peinado: "largo", tela: "blanco", objeto: "ninguno" }, (g, t, { piel }) => {
